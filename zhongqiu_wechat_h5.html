<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#10072d">
<title>中秋快乐 🌕</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:linear-gradient(180deg,#08051d 0%,#171047 52%,#4b174f 100%);
  color:#fff;position:relative;
}
.page{width:100%;height:100%;position:relative;overflow:hidden}
.stars{position:absolute;inset:0}
.star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;box-shadow:0 0 8px #fff;animation:twinkle 2s infinite alternate}
@keyframes twinkle{from{opacity:.2;transform:scale(.6)}to{opacity:1;transform:scale(1.3)}}
.cloud{position:absolute;opacity:.18;color:#f9e8c2;font-size:42px;white-space:nowrap;animation:cloud 18s linear infinite}
.c1{top:20%;left:-20%}.c2{top:43%;right:-30%;animation-duration:22s;animation-direction:reverse}
@keyframes cloud{from{transform:translateX(0)}to{transform:translateX(150vw)}}
.lantern{position:absolute;top:16px;font-size:58px;filter:drop-shadow(0 0 12px rgba(255,80,40,.7));animation:swing 3s ease-in-out infinite;transform-origin:top center}
.l1{left:18px}.l2{right:18px;animation-delay:1.1s}
@keyframes swing{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.moon{
  position:absolute;top:10%;left:50%;transform:translateX(-50%);
  width:min(58vw,270px);height:min(58vw,270px);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fffbe1 0,#fff0a7 58%,#f7d66f 100%);
  box-shadow:0 0 25px #fff1a8,0 0 70px rgba(255,235,150,.65),0 0 130px rgba(255,215,100,.25);
  cursor:pointer;animation:float 3s ease-in-out infinite;
}
.crater{position:absolute;border-radius:50%;background:rgba(190,160,90,.15)}
.cr1{width:42px;height:42px;left:25%;top:27%}.cr2{width:58px;height:58px;right:20%;top:52%}.cr3{width:30px;height:30px;left:28%;bottom:20%}.cr4{width:22px;height:22px;right:32%;top:22%}
@keyframes float{50%{transform:translateX(-50%) translateY(-10px)}}
.rabbit{position:absolute;top:35%;left:50%;transform:translateX(-50%);font-size:76px;animation:hop 2.5s infinite}
@keyframes hop{0%,80%,100%{transform:translateX(-50%) translateY(0)}90%{transform:translateX(-50%) translateY(-18px)}}
.content{position:absolute;top:48%;width:100%;text-align:center;padding:0 24px}
h1{font-size:42px;letter-spacing:9px;color:#ffe9a3;text-shadow:0 0 16px rgba(255,220,100,.7);margin-bottom:10px}
.sub{font-size:17px;letter-spacing:4px;color:#ffe0b5}
.card{
  width:min(88%,420px);margin:28px auto 0;padding:22px 20px;border-radius:24px;
  background:rgba(255,255,255,.11);border:1px solid rgba(255,235,180,.28);
  box-shadow:0 12px 40px rgba(0,0,0,.28);backdrop-filter:blur(8px)
}
.card p{font-size:17px;line-height:1.9;color:#fff4d3;min-height:64px}
button{
  margin-top:15px;border:0;border-radius:999px;padding:12px 30px;
  font-size:16px;font-weight:bold;color:#5b2b15;background:linear-gradient(90deg,#f4bd55,#ffe28d);
  box-shadow:0 5px 20px rgba(255,207,92,.25)
}
.footer{position:absolute;bottom:24px;width:100%;text-align:center;color:#d9b9c9;font-size:13px}
.tip{position:absolute;top:calc(10% + min(58vw,270px) + 10px);width:100%;text-align:center;font-size:13px;color:#ffe8aa;opacity:.8}
.overlay{position:absolute;inset:0;background:rgba(5,3,20,.72);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.3s;z-index:10}
.overlay.show{opacity:1;pointer-events:auto}
.modal{width:82%;max-width:360px;text-align:center;padding:30px 22px;border-radius:26px;background:linear-gradient(160deg,#33205b,#642653);border:1px solid rgba(255,226,150,.35);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.modal .big{font-size:48px}.modal h2{margin:10px 0;color:#ffe8a3}.modal p{line-height:1.9;color:#fff1d4}
.petal{position:absolute;top:-30px;font-size:22px;animation:fall linear forwards;z-index:5}
@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(540deg);opacity:.1}}
@media(max-height:650px){.content{top:45%}.card{margin-top:18px;padding:16px}.card p{min-height:50px}.rabbit{top:32%}}
</style>
</head>
<body>
<div class="page">
  <div class="stars">
    <i class="star" style="left:8%;top:14%;animation-delay:.2s"></i>
    <i class="star" style="left:22%;top:28%;animation-delay:1s"></i>
    <i class="star" style="left:37%;top:9%;animation-delay:.5s"></i>
    <i class="star" style="left:63%;top:16%;animation-delay:1.3s"></i>
    <i class="star" style="left:82%;top:11%;animation-delay:.7s"></i>
    <i class="star" style="left:91%;top:32%;animation-delay:.1s"></i>
    <i class="star" style="left:12%;top:42%;animation-delay:.9s"></i>
    <i class="star" style="left:73%;top:38%;animation-delay:.4s"></i>
  </div>
  <div class="cloud c1">☁︎　☁︎　☁︎</div>
  <div class="cloud c2">☁︎　☁︎　☁︎</div>
  <div class="lantern l1">🏮</div><div class="lantern l2">🏮</div>
  <div class="moon" id="moon" aria-label="点击月亮">
    <span class="crater cr1"></span><span class="crater cr2"></span><span class="crater cr3"></span><span class="crater cr4"></span>
  </div>
  <div class="tip">点击月亮 · 收下中秋祝福</div>
  <div class="rabbit">🐇</div>
  <div class="content">
    <h1>中秋快乐</h1>
    <div class="sub">花好月圆 · 阖家幸福</div>
    <div class="card">
      <p id="blessing">愿月光照亮你的生活，愿所有美好都如期而至。</p>
      <button id="btn">🎁 换一份祝福</button>
    </div>
  </div>
  <div class="footer">🌕 愿你所念皆所愿，所遇皆美好 🌕</div>
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="big">🌕🐇</div>
      <h2>月亮把祝福送给你</h2>
      <p id="modalText">愿你平安喜乐，万事顺遂；愿家人常伴，岁岁团圆。</p>
      <button id="close">收下祝福 ✨</button>
    </div>
  </div>
</div>
<script>
const blessings=[
"愿你平安喜乐，万事顺遂；愿家人常伴，岁岁团圆。",
"月到中秋分外明，愿你的生活甜甜蜜蜜，幸福常在。",
"愿所有等待都有回应，所有愿望都能实现，中秋快乐！",
"愿你抬头看见月亮，低头遇见温暖，所行皆坦途。",
"一轮明月寄相思，愿你事业顺利、家庭幸福、笑口常开。",
"愿这个中秋，有月饼、有月亮，也有属于你的满满幸福。"
];
const blessing=document.getElementById("blessing");
const overlay=document.getElementById("overlay");
const modalText=document.getElementById("modalText");
function randomBlessing(){
  const t=blessings[Math.floor(Math.random()*blessings.length)];
  blessing.textContent=t; modalText.textContent=t;
}
document.getElementById("btn").onclick=()=>{randomBlessing();makePetals(12)};
document.getElementById("moon").onclick=()=>{randomBlessing();overlay.classList.add("show");makePetals(18)};
document.getElementById("close").onclick=()=>overlay.classList.remove("show");
overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove("show")};
function makePetals(n){
  for(let i=0;i<n;i++){
    const el=document.createElement("span");el.className="petal";el.textContent=Math.random()>.5?"🌸":"✨";
    el.style.left=Math.random()*100+"vw";
    el.style.setProperty("--x",(Math.random()*160-80)+"px");
    el.style.animationDuration=(3+Math.random()*3)+"s";
    el.style.animationDelay=(Math.random()*.5)+"s";
    document.querySelector(".page").appendChild(el);
    setTimeout(()=>el.remove(),6500);
  }
}
</script>
</body>
</html>
